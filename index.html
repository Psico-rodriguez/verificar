<title>Verificación de certificado</title><script src="config.js"></script>
<style>
:root{--bg:#dfeaf7}@media(prefers-color-scheme:dark){:root{--bg:#0e1726}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 system-ui,sans-serif;color:#1b2a41;padding:14px}
.sheet{position:relative;max-width:820px;margin:auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(10,40,90,.2);padding-bottom:70px}
.deco{position:absolute;left:0;width:100%;pointer-events:none}
header{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:28px 28px 0}
.who{padding-top:22px}.who b{display:block;font:600 20px/1.2 Georgia,serif;color:#0d3b8e}.who span{display:block;border-top:2px solid #2a8fdc;margin-top:5px;padding-top:3px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#3d5f94}
header img{width:110px;height:auto}.in{position:relative;padding:8px 28px 0}
form{display:flex;gap:8px;margin:6px 0 4px}input[type=text]{flex:1;padding:10px;border:1px solid #9fb6d6;border-radius:8px;font:inherit;text-transform:uppercase}
button{background:#0d4a9e;color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600}
.b{margin-top:14px;border-radius:10px;padding:14px;border-left:6px solid}.ok{background:#e7f6ee;border-color:#1a7f4b;color:#0f4d2d}.no{background:#fdeceb;border-color:#b42318;color:#7a1810}.wa{background:#fff4e5;border-color:#b54708;color:#6b3004}
.b h2{margin:0 0 6px;font-size:18px}dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}dt{font-weight:600}dd{margin:0}
.sec{margin-top:14px;border:1px solid #b9d6f1;border-radius:10px;background:#f3f8fe;padding:12px 14px}.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#0d3b8e}
details{margin-top:16px;font-size:14px}summary{cursor:pointer;color:#0d4a9e;font-weight:600}code{word-break:break-all;font-size:12px}footer{margin-top:14px;font-size:12px;color:#5b6b85}

<div class="in">
<form id="f"><input type="text" id="c" placeholder="Código, ej. ABCD-EFGH-JKMN" autocomplete="off"><button>Verificar</button></form>
<div id="r"></div><div id="dt"></div>
<details><summary>Comprobar que el PDF no fue alterado</summary><p>El archivo no se sube a ningún servidor: la huella (SHA-256) se calcula en su dispositivo.</p><input type="file" id="p" accept="application/pdf"><div id="h"></div></details>
<footer>Para validar la tarjeta profesional, consulte al Colegio Colombiano de Psicólogos (COLPSIC).</footer>

<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fb=s=>{s=String(s||'');const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'—')};
const box=(k,t,b)=>`<div class="b ${k}"><h2>${t}</h2>${b||''}</div>`;
async function buscar(c){const r=await fetch('https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents/certificados/'+c);if(r.status===404||r.status===403&&false)return{ok:false};if(!r.ok)throw new Error(r.status);const d=await r.json(),o={};for(const k in(d.fields||{}))o[k]=Object.values(d.fields[k])[0];return{ok:true,r:o}}
function escala(){const w=$('dw'),f=$('df');if(!w||!f)return;const s=Math.min(1,w.clientWidth/794);f.style.transform='scale('+s+')';w.style.height=(1123*s)+'px'}
function mostrarDoc(h){$('dt').innerHTML='<div class="sec" style="padding:8px"><h3>Documento original</h3><div id="dw" style="position:relative;overflow:hidden"><iframe id="df" sandbox="allow-same-origin allow-modals" style="border:0;width:794px;height:1123px;transform-origin:0 0;background:#fff"></iframe></div><button id="dp" type="button" style="margin-top:10px">Descargar / imprimir PDF</button><p style="margin:8px 0 0;font-size:12px;color:#5b6b85">Compare este documento con el que tiene en la mano.</p></div>';const f=$('df');f.srcdoc=h;escala();$('dp').onclick=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){alert('Use Ctrl+P para imprimir o guardar como PDF.')}}}
addEventListener('resize',escala);
let cur=null;
async function go(){
 const c=$('c').value.toUpperCase().replace(/[^A-Z0-9]/g,'');cur=null;$('dt').innerHTML='';
 if(!c){$('r').innerHTML='';return}
 if(typeof FB==='undefined'||!FB.projectId||String(FB.projectId).startsWith('PEGUE')){$('r').innerHTML=box('wa','Página sin configurar','<p>Falta la dirección de la nube en config.js.</p>');return}
 if(c.length<12){$('r').innerHTML=box('no','Código incompleto','<p>El código tiene 12 caracteres.</p>');return}
 $('r').innerHTML='<p>Consultando…</p>';
 let j;try{j=await buscar(c)}catch(e){$('r').innerHTML=box('wa','No se pudo consultar','<p>Intente de nuevo en unos minutos.</p>');return}
 if(!j.ok){$('r').innerHTML=box('no','Código no encontrado','<p>No existe un certificado registrado con este código. Desconfíe del documento.</p>');return}
 const x=cur=j.r,hoy=new Date().toISOString().slice(0,10),est=String(x.estado||'').toLowerCase();
 const d=`<dl><dt>Código</dt><dd>${esc(c.replace(/(.{4})(?=.)/g,'$1-'))}</dd><dt>Profesional</dt><dd>${esc(x.profesional)}</dd><dt>T.P. N.°</dt><dd>${esc(x.tp)} (COLPSIC)</dd><dt>Emisión</dt><dd>${fb(x.emision)}</dd><dt>Vigente hasta</dt><dd>${x.vigencia_hasta?fb(x.vigencia_hasta):'No indicada'}</dd></dl>`;
 if(est==='revocado')$('r').innerHTML=box('no','Certificado REVOCADO','<p>Este certificado fue anulado por el profesional.</p>'+d);
 else if(x.vigencia_hasta&&hoy>x.vigencia_hasta)$('r').innerHTML=box('wa','Certificado auténtico, pero vencido',d);
 else $('r').innerHTML=box('ok','Certificado auténtico y vigente',d);
 if(x.copia)mostrarDoc(x.copia);else $('dt').innerHTML=`<div class="sec"><h3>Consultante</h3><dl><dt>Nombre</dt><dd>${esc(x.consultante||'—')}</dd><dt>Documento</dt><dd>${esc(x.documento||'—')}</dd></dl></div>
 <div class="sec"><h3>Animal de soporte emocional</h3><dl><dt>Nombre</dt><dd>${esc(x.animal||'—')}</dd><dt>Especie</dt><dd>${esc(x.especie||'—')}</dd><dt>Raza</dt><dd>${esc(x.raza||'—')}</dd><dt>Nacimiento</dt><dd>${fb(x.nacimiento)}</dd>${x.sexo?'<dt>Sexo</dt><dd>'+esc(x.sexo)+'</dd>':''}</dl></div>
 <div class="sec"><h3>Determinación profesional</h3><p style="margin:0">El profesional determinó la necesidad de que la persona cuente con su animal de soporte emocional como parte del tratamiento, manejo o estabilización de una condición de salud mental documentada, en los términos de la Ley 2473 de 2025.${x.contextos?' Acompañamiento '+esc(x.contextos)+', según las condiciones de cada entidad.':''}</p></div>`;
}
$('f').onsubmit=e=>{e.preventDefault();go()};
const q=new URLSearchParams(location.search).get('c');if(q){$('c').value=q;go()}
$('p').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 const b=await crypto.subtle.digest('SHA-256',await f.arrayBuffer()),h=Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
 let m=`<p>Huella del archivo:<br><code>${h}</code></p>`;
 if(!cur)m+='<p>Verifique primero el código del certificado para comparar.</p>';
 else if(!cur.hash)m+='<p>Este certificado no tiene huella registrada.</p>';
 else m+=String(cur.hash).toLowerCase()===h?'<p><b>✔ El archivo coincide con el original registrado.</b></p>':'<p><b>✖ El archivo NO coincide con el original: pudo haber sido alterado.</b></p>';
 $('h').innerHTML=m};
</script></body></html>
